<title>55 Mapas Mentais de Português</title>
<script>
(function () {
    var url = new URL('../', location.href);
    var params = new URLSearchParams(location.search);
    var defaults = { utm_source: 'area-portugues', utm_medium: 'indicacao', utm_campaign: 'indicacao-area-portugues', utm_content: 'link-curto' };
    Object.keys(defaults).forEach(function (key) { if (!params.get(key)) params.set(key, defaults[key]); });
    url.search = params.toString();
    url.hash = location.hash;
    location.replace(url.href);
})();
</script>
</head>
