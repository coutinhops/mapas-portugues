name: Apply site changes

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and commit
        run: |
          python3 scripts/apply_changes.py
          rm -f .github/workflows/apply-changes.yml scripts/apply_changes.py apply-changes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
          else
            git commit -m 'Atualiza checkouts e pixels'
            git push
          fi
